<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Cup Football - Dashboard</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151d2a;
            --bg-hover: #212d42;
            --accent-blue: #2563eb;
            --accent-green: #10b981;
            --accent-gold: #f59e0b;
            --accent-purple: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            padding: 16px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid #1e293b;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--accent-gold);
            margin-bottom: 8px;
        }

        p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #1e293b;
        }

        .btn {
            display: inline-block;
            background: var(--accent-blue);
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Quantum Cup Football</h1>
        <p>Dashboard Analisi Calcio & Pronostici</p>
    </header>

    <div class="card">
        <h2>Stato Sistema</h2>
        <p>Connessione attiva e pronta per la scansione dei dati calcistici.</p>
        <a href="#" class="btn">Aggiorna Dati</a>
    </div>

</body>
</html>
