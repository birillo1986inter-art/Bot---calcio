<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Cup Football - Dashboard</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151d2a;
            --bg-hover: #212d42;
            --accent-blue: #2563eb;
            --accent-green: #10b981;
            --accent-gold: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 12px; max-width: 1200px; margin: 0 auto; }

        header {
            text-align: center; margin-bottom: 16px; padding: 16px;
            background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border);
        }
        h1 { font-size: 1.5rem; color: var(--accent-gold); }
        .subtitle { color: var(--text-muted); font-size: 0.8rem; margin-top: 4px; }

        .nav-leagues {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px;
        }
        .league-btn {
            background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border);
            padding: 8px 14px; border-radius: 8px; white-space: nowrap; cursor: pointer; font-size: 0.85rem; font-weight: 600;
        }
        .league-btn.active { background: var(--accent-blue); border-color: var(--accent-blue); }

        .match-card {
            background: var(--bg-card); border-radius: 12px; padding: 14px;
            border: 1px solid var(--border); margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px;
        }
        .match-header { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 0.75rem; font-weight: 600; }
        .match-teams { display: flex; justify-content: space-between; align-items: center; font-size: 1rem; font-weight: bold; }
        .vs { color: var(--accent-gold); font-size: 0.8rem; }

        .odds-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
            background: var(--bg-main); padding: 8px; border-radius: 8px;
        }
        .odd-box {
            display: flex; flex-direction: column; align-items: center;
            background: var(--bg-card); padding: 6px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.75rem;
        }
        .odd-label { color: var(--text-muted); font-size: 0.65rem; }
        .odd-val { color: var(--accent-blue); font-weight: bold; margin-top: 2px; }

        .prediction-box {
            background: rgba(37, 99, 235, 0.1); border: 1px solid var(--accent-blue);
            border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 4px;
        }
        .prono-title { color: var(--accent-gold); font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
        .prono-badge { background: var(--accent-green); color: black; font-weight: bold; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; width: fit-content; }
        .prono-stats { color: var(--text-muted); font-size: 0.75rem; }
        .loading { text-align: center; color: var(--text-muted); padding: 20px; }
    </style>
</head>
<body>

    <header>
        <h1>Quantum Cup Football</h1>
        <p class="subtitle">Dashboard Analisi Calcio & Pronostici</p>
    </header>

    <div class="nav-leagues">
        <button class="league-btn active" onclick="loadLeague('ITA', this)">🇮🇹 Serie A</button>
        <button class="league-btn" onclick="loadLeague('ENG', this)">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier</button>
        <button class="league-btn" onclick="loadLeague('ESP', this)">🇪🇸 La Liga</button>
        <button class="league-btn" onclick="loadLeague('GER', this)">🇩🇪 Bundesliga</button>
        <button class="league-btn" onclick="loadLeague('FRA', this)">🇫🇷 Ligue 1</button>
    </div>

    <div id="matchesContainer">
        <div class="loading">Caricamento palinsesto in corso...</div>
    </div>

    <script>
        let currentLeague = 'ITA';

        async function loadLeague(code, btnElement) {
            if (btnElement) {
                document.querySelectorAll('.league-btn').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            }
            currentLeague = code;
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '<div class="loading">Aggiornamento dati...</div>';

            try {
                const response = await fetch('./dati_calcio.json?v=' + new Date().getTime());
                const data = await response.json();
                const matches = data[code] || [];

                if (matches.length === 0) {
                    container.innerHTML = '<div class="loading">Nessuna partita disponibile al momento per questo campionato.</div>';
                    return;
                }

                let html = '';
                matches.forEach(m => {
                    html += `
                        <div class="match-card">
                            <div class="match-header">
                                <span>ORARIO: ${m.time}</span>
                                <span>ANALISI LIVE</span>
                            </div>
                            <div class="match-teams">
                                <span>${m.home}</span>
                                <span class="vs">VS</span>
                                <span>${m.away}</span>
                            </div>
                            <div class="odds-grid">
                                <div class="odd-box"><span class="odd-label">1</span><span class="odd-val">${m.odds['1']}</span></div>
                                <div class="odd-box"><span class="odd-label">X</span><span class="odd-val">${m.odds['X']}</span></div>
                                <div class="odd-box"><span class="odd-label">2</span><span class="odd-val">${m.odds['2']}</span></div>
                                <div class="odd-box"><span class="odd-label">1X</span><span class="odd-val">${m.odds['1X']}</span></div>
                                <div class="odd-box"><span class="odd-label">12</span><span class="odd-val">${m.odds['12']}</span></div>
                                <div class="odd-box"><span class="odd-label">X2</span><span class="odd-val">${m.odds['X2']}</span></div>
                                <div class="odd-box"><span class="odd-label">O 1.5</span><span class="odd-val">${m.odds['O1.5']}</span></div>
                                <div class="odd-box"><span class="odd-label">O 2.5</span><span class="odd-val">${m.odds['O2.5']}</span></div>
                                <div class="odd-box"><span class="odd-label">O 3.5</span><span class="odd-val">${m.odds['O3.5']}</span></div>
                            </div>
                            <div class="prediction-box">
                                <span class="prono-title">Pronostico (Affidabilità ${m.confidence})</span>
                                <span class="prono-badge">${m.prono}</span>
                                <span class="prono-stats">${m.desc}</span>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = '<div class="loading">Errore nel caricamento dei dati JSON. Riprova tra poco.</div>';
            }
        }

        // Avvio automatico al caricamento
        loadLeague('ITA', null);
    </script>
</body>
</html>
